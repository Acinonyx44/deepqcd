[project]
name = "deepqcd"
version = "0.1.0"
description = "Study / reproduction of DeepQCD (Kurt et al., J. Franklin Inst. 2024): end-to-end RNN quickest change detection"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
notebooks = ["jupyterlab>=4.2", "ipykernel"]
realdata = ["scipy>=1.13"]          # .mat files of the KL-CPD datasets (deepqcd_real.py)
zeroshot = [
    "chronos-forecasting>=2.0",
    "transformers>=4.45",
]
